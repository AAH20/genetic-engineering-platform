[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genetic-engineering-platform"
version = "0.1.0"
description = "Unified platform for genetic engineering: CRISPR, protein engineering, synthetic biology, gene therapy, and AI/ML"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Ahmed Hassan", email = "aah@a2zsoc.com"}
]
dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "networkx>=3.0.0,<4.0.0",
    "scipy>=1.10.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=4.0.0,<6.0.0",
    "ruff>=0.1.0,<1.0.0",
    "bandit>=1.7.0,<2.0.0",
    "mypy>=1.0.0,<2.0.0",
]
ml = [
    "torch>=2.0.0,<3.0.0",
    "transformers>=4.30.0,<5.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/aiml",
    "src/biosecurity",
    "src/crispr",
    "src/genetherapy",
    "src/genomics",
    "src/integration",
    "src/metabolic",
    "src/pipeline",
    "src/protein",
    "src/sizing",
    "src/synbio",
]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "examples/", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/test_properties.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
